name: CI + Deploy

# 1) check: GitHub serverida kod quriladi — buzilgan bo'lsa shu yerda to'xtaydi.
# 2) deploy: FAQAT check yashil bo'lsa serverga SSH qilib yangilaydi.
on:
  push:
    branches: [master]

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: yarn install
      - name: Build
        run: yarn build

  deploy:
    name: Deploy to server
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /media/gymora-project/gymora-front
            git pull origin master
            docker compose up -d --force-recreate
