name: Deploy

# master'ga push -> serverda git pull + konteyner qayta quriladi.
# Faqat shu loyiha konteyneriga tegadi (docker compose o'z faylidagini boshqaradi).
on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /media/gymora-project/gymora-front
            git pull origin master
            docker compose up -d --force-recreate
